name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the packages
        run: pnpm build
      - name: Typecheck all packages (tests included)
        run: pnpm run typecheck
      - name: Typecheck examples against local SDK
        run: pnpm run typecheck:examples
      - name: Test all packages
        run: pnpm --workspace-concurrency=1 -r test
