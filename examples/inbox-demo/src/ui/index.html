<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        background: var(--surface-50, #fafafa);
        color: var(--surface-900, #111);
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }
      .subtitle {
        color: var(--surface-500, #666);
        margin-bottom: 24px;
        font-size: 0.875rem;
      }
      .field {
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: var(--surface-500, #666);
        margin-bottom: 4px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--surface-200, #ddd);
        border-radius: 6px;
        background: var(--surface-0, #fff);
        color: inherit;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        background: rgb(var(--accent-rgb, 37 99 235));
      }
      button.secondary {
        background: #475569;
      }
      ul {
        list-style: none;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--surface-200, #eee);
        border-radius: 8px;
        background: var(--surface-0, #fff);
        margin-bottom: 8px;
      }
      .item .title {
        font-weight: 600;
      }
      .item .body {
        font-size: 0.8rem;
        color: var(--surface-500, #666);
      }
      .btn-danger {
        background: #dc2626;
        padding: 6px 10px;
        font-size: 0.8rem;
      }
      .empty {
        color: var(--surface-400, #999);
        font-size: 0.85rem;
      }
      .count {
        font-size: 0.8rem;
        color: var(--surface-400, #999);
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Inbox Demo</h1>
    <p class="subtitle">Publish items to the AMC inbox</p>

    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="Deploy finished" />
    </div>
    <div class="field">
      <label for="body">Body</label>
      <input id="body" type="text" placeholder="Build #42 shipped to production" />
    </div>
    <div class="field">
      <label for="priority">Priority</label>
      <select id="priority">
        <option value="low">low</option>
        <option value="normal" selected>normal</option>
        <option value="high">high</option>
      </select>
    </div>

    <div class="row">
      <button id="add-btn">Add to inbox</button>
      <button id="clear-btn" class="secondary">Clear all</button>
    </div>

    <div class="count" id="count">0 items</div>
    <ul id="item-list"></ul>

    <script src="plugin.js"></script>
  </body>
</html>
