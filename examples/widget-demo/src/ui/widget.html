<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Demo popover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; background: var(--surface-50, #fafafa); color: var(--surface-900, #111); }
    h1 { font-size: 1rem; margin-bottom: 6px; }
    p { font-size: 0.875rem; color: var(--surface-500, #666); }
  </style>
</head>
<body>
  <!-- Shown in the 320x256 popover that opens when the titlebar widget is clicked. -->
  <h1>Widget Demo</h1>
  <p>This page is the popover behind the titlebar widget. It is declared as ui.widget.entryPoint in the manifest.</p>
</body>
</html>
