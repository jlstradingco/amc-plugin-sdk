<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storage Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        background: var(--surface-50, #fafafa);
        color: var(--surface-900, #111);
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }
      .subtitle {
        color: var(--surface-500, #666);
        margin-bottom: 24px;
        font-size: 0.875rem;
      }

      .form-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input,
      textarea {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid var(--surface-300, #ddd);
        border-radius: 6px;
        font-size: 0.875rem;
        background: var(--surface-0, #fff);
        color: var(--surface-900, #111);
      }
      textarea {
        min-height: 60px;
        resize: vertical;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .btn-primary {
        background: #2563eb;
        color: #fff;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-danger {
        background: #dc2626;
        color: #fff;
        font-size: 0.75rem;
        padding: 4px 8px;
      }
      .btn-danger:hover {
        background: #b91c1c;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .toolbar label {
        font-size: 0.8rem;
        color: var(--surface-500);
      }

      .note-list {
        list-style: none;
      }
      .note-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--surface-200, #eee);
        border-radius: 8px;
        margin-bottom: 8px;
        background: var(--surface-0, #fff);
      }
      .note-item .content {
        flex: 1;
      }
      .note-item .title {
        font-weight: 600;
        margin-bottom: 2px;
      }
      .note-item .body {
        font-size: 0.85rem;
        color: var(--surface-600, #555);
      }
      .empty {
        text-align: center;
        padding: 40px;
        color: var(--surface-400, #999);
      }
    </style>
  </head>
  <body>
    <h1>Storage Demo</h1>
    <p class="subtitle">Key-value storage + database collections</p>

    <div class="form-row">
      <input type="text" id="title" placeholder="Note title" />
    </div>
    <div class="form-row">
      <textarea id="body" placeholder="Note body"></textarea>
    </div>
    <div class="form-row">
      <button class="btn-primary" id="save-btn">Save Note</button>
    </div>

    <div class="toolbar">
      <label>
        <input type="checkbox" id="sort-toggle" />
        Newest first
      </label>
      <span id="count" style="margin-left:auto; font-size:0.8rem; color:var(--surface-400)"></span>
    </div>

    <ul class="note-list" id="note-list"></ul>

    <script src="plugin.js"></script>
  </body>
</html>
