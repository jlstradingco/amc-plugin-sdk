<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        background: var(--surface-50, #fafafa);
        color: var(--surface-900, #111);
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 4px;
      }
      .subtitle {
        color: var(--surface-500, #666);
        margin-bottom: 24px;
        font-size: 0.875rem;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent-rgb, #2563eb);
        background: rgb(var(--accent-rgb, 37 99 235));
      }
      button.secondary {
        background: #475569;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card {
        padding: 16px;
        border-radius: 10px;
        border: 1px solid var(--surface-200, #eee);
        background: var(--surface-0, #fff);
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 0.95rem;
        margin-bottom: 8px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'SFMono-Regular', Consolas, monospace;
        font-size: 0.8rem;
        color: var(--surface-700, #333);
      }
      .empty {
        color: var(--surface-400, #999);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>Auth Demo</h1>
    <p class="subtitle">Identity &amp; scoped OAuth tokens</p>

    <div class="row">
      <button id="btn-who">Who am I?</button>
      <button id="btn-signin" class="secondary">Request sign-in</button>
    </div>

    <div class="card">
      <h2>Identity</h2>
      <pre id="identity"><span class="empty">Click "Who am I?"</span></pre>
    </div>

    <div class="row">
      <button id="btn-google" class="secondary">Google token (calendar.readonly)</button>
      <button id="btn-github" class="secondary">GitHub token (repo)</button>
    </div>

    <div class="card">
      <h2>Scoped session</h2>
      <pre id="session"><span class="empty">Request a provider token above</span></pre>
    </div>

    <script src="plugin.js"></script>
  </body>
</html>
