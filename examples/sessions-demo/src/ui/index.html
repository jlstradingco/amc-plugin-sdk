<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sessions Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 24px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--surface-50, #fafafa);
        color: var(--surface-900, #111);
      }
      h1 { font-size: 1.5rem; margin-bottom: 4px; }
      .subtitle { color: var(--surface-500, #666); margin-bottom: 16px; font-size: 0.875rem; }
      .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
      input {
        flex: 1; padding: 10px 14px;
        border: 1px solid var(--surface-300, #ddd);
        border-radius: 8px; font-size: 0.9rem;
        background: var(--surface-0, #fff);
        color: var(--surface-900, #111);
      }
      button {
        padding: 10px 20px; border: none; border-radius: 8px;
        cursor: pointer; font-size: 0.875rem; font-weight: 600; color: #fff;
      }
      .btn-primary { background: #2563eb; }
      .btn-primary:hover { background: #1d4ed8; }
      .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
      .btn-danger { background: #dc2626; }
      .btn-danger:hover { background: #b91c1c; }
      .status-bar {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 12px; font-size: 0.8rem; color: var(--surface-500);
      }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; }
      .status-idle { background: var(--surface-300, #ccc); }
      .status-starting { background: #f59e0b; }
      .status-running { background: #22c55e; animation: pulse 1.5s infinite; }
      .status-ended { background: var(--surface-400, #999); }
      .status-error { background: #ef4444; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .messages {
        flex: 1; overflow-y: auto;
        border: 1px solid var(--surface-200, #eee);
        border-radius: 8px; padding: 12px;
        background: var(--surface-0, #fff);
      }
      .message {
        padding: 8px 12px; margin-bottom: 8px; border-radius: 6px;
        font-size: 0.85rem; white-space: pre-wrap; word-break: break-word;
      }
      .msg-operator { background: #dbeafe; }
      .msg-agent { background: var(--surface-100, #f5f5f5); }
      .msg-system { background: #fef3c7; font-style: italic; }
      .empty { text-align: center; padding: 40px; color: var(--surface-400, #999); }
    </style>
  </head>
  <body>
    <h1>Sessions Demo</h1>
    <p class="subtitle">Spawn Claude sessions and stream results</p>
    <div class="input-row">
      <input type="text" id="prompt" placeholder="Ask Claude something..." />
      <button class="btn-primary" id="ask-btn">Ask Claude</button>
      <button class="btn-danger" id="stop-btn" style="display:none">Stop</button>
    </div>
    <div class="status-bar">
      <div class="status-dot status-idle" id="status-dot"></div>
      <span id="status-text">Idle</span>
    </div>
    <div class="messages" id="messages">
      <div class="empty">Send a prompt to start a session</div>
    </div>
    <script src="plugin.js"></script>
  </body>
</html>
